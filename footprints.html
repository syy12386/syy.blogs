<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的足迹 - 小羊星冰乐</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="card footprints-card">
            <div class="back-link">
                <a href="index.html" class="btn btn-secondary">← 返回主页</a>
            </div>
            
            <h1 class="page-title">我的<span class="highlight">足迹</span></h1>
            
            <div class="map-container">
                <div style="border:3px solid #000; border-radius:12px; overflow:hidden; box-shadow:5px 5px 0 #000; height:400px; width:100%;">
                  <div id="amap-container" style="width:100%; height:100%;"></div>
                </div>
            </div>
            
            <script src="https://webapi.amap.com/maps?v=1.4.15&key=f1387d7959d15c09ace98d64531e30fb"></script>
            <script>
            var map = new AMap.Map('amap-container', {
              zoom: 4,
              center: [116.397428, 39.90923],
              mapStyle: 'amap://styles/lightblue',
              viewMode: '3D'
            });

            var starMarkers = [
                { lng: 117.2830, lat: 31.8612, city: "合肥" },
                { lng: 116.8344, lat: 32.9370, city: "淮南" },
                { lng: 115.8155, lat: 32.8015, city: "阜阳" },
                { lng: 121.4737, lat: 31.2304, city: "上海" },
                { lng: 120.1936, lat: 30.2741, city: "浙江" },
                { lng: 118.7969, lat: 32.0603, city: "南京" },
                { lng: 108.9480, lat: 34.2619, city: "陕西" }
            ];

            starMarkers.forEach(function(point) {
              var starIcon = new AMap.Icon({
                size: new AMap.Size(32, 32),
                image: 'https://cdn-icons-png.flaticon.com/512/1828/1828884.png',
                imageSize: new AMap.Size(32, 32)
              });

              var marker = new AMap.Marker({
                position: new AMap.LngLat(point.lng, point.lat),
                icon: starIcon,
                offset: new AMap.Pixel(-16, -16)
              });

              marker.setMap(map);
              marker.on('click', function() {
                var infoWindow = new AMap.InfoWindow({
                  content: `<h4 style="color:#333; margin:0;">${point.city}</h4>`,
                  offset: new AMap.Pixel(0, -30)
                });
                infoWindow.open(map, marker.getPosition());
              });
            });
            </script>
            
            <div class="gallery-wall">
                <h3 class="section-title">旅行相册</h3>
                <div class="perspective-container">
                    <div class="gallery-grid">
                        <div class="gallery-card" data-city="合肥" data-label="安徽 · 省会" data-emoji="🏙️">
                            <div class="card-inner">
                                <div class="card-face card-front">
                                    <span class="emoji-icon">🏙️</span>
                                </div>
                                <div class="card-face card-back">
                                    <span class="card-city">合肥</span>
                                    <span class="card-label">安徽 · 省会</span>
                                </div>
                            </div>
                        </div>
                        <div class="gallery-card small" data-city="淮南" data-label="安理校园" data-emoji="🏘️">
                            <div class="card-inner">
                                <div class="card-face card-front">
                                    <span class="emoji-icon">🏘️</span>
                                </div>
                                <div class="card-face card-back">
                                    <span class="card-city">淮南</span>
                                    <span class="card-label">安理校园</span>
                                </div>
                            </div>
                        </div>
                        <div class="gallery-card wide" data-city="上海" data-label="外滩夜景" data-emoji="🗼">
                            <div class="card-inner">
                                <div class="card-face card-front">
                                    <span class="emoji-icon">🗼</span>
                                </div>
                                <div class="card-face card-back">
                                    <span class="card-city">上海</span>
                                    <span class="card-label">外滩夜景</span>
                                </div>
                            </div>
                        </div>
                        <div class="gallery-card tall" data-city="杭州" data-label="西湖美景" data-emoji="🏯">
                            <div class="card-inner">
                                <div class="card-face card-front">
                                    <span class="emoji-icon">🏯</span>
                                </div>
                                <div class="card-face card-back">
                                    <span class="card-city">杭州</span>
                                    <span class="card-label">西湖美景</span>
                                </div>
                            </div>
                        </div>
                        <div class="gallery-card" data-city="阜阳" data-label="安徽 · 故乡" data-emoji="🌾">
                            <div class="card-inner">
                                <div class="card-face card-front">
                                    <span class="emoji-icon">🌾</span>
                                </div>
                                <div class="card-face card-back">
                                    <span class="card-city">阜阳</span>
                                    <span class="card-label">安徽 · 故乡</span>
                                </div>
                            </div>
                        </div>
                        <div class="gallery-card small" data-city="南京" data-label="中山陵园" data-emoji="🏛️">
                            <div class="card-inner">
                                <div class="card-face card-front">
                                    <span class="emoji-icon">🏛️</span>
                                </div>
                                <div class="card-face card-back">
                                    <span class="card-city">南京</span>
                                    <span class="card-label">中山陵园</span>
                                </div>
                            </div>
                        </div>
                        <div class="gallery-card" data-city="西安" data-label="兵马俑" data-emoji="🕌">
                            <div class="card-inner">
                                <div class="card-face card-front">
                                    <span class="emoji-icon">🕌</span>
                                </div>
                                <div class="card-face card-back">
                                    <span class="card-city">西安</span>
                                    <span class="card-label">兵马俑</span>
                                </div>
                            </div>
                        </div>
                        <div class="gallery-card wide" data-city="北京" data-label="故宫" data-emoji="🏯">
                            <div class="card-inner">
                                <div class="card-face card-front">
                                    <span class="emoji-icon">🏯</span>
                                </div>
                                <div class="card-face card-back">
                                    <span class="card-city">北京</span>
                                    <span class="card-label">故宫</span>
                                </div>
                            </div>
                        </div>
                        <div class="gallery-card tall" data-city="成都" data-label="大熊猫基地" data-emoji="🐼">
                            <div class="card-inner">
                                <div class="card-face card-front">
                                    <span class="emoji-icon">🐼</span>
                                </div>
                                <div class="card-face card-back">
                                    <span class="card-city">成都</span>
                                    <span class="card-label">大熊猫基地</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="gallery-hint">
                        <span>👆 点击图片查看详情</span>
                    </div>
                </div>
                
                <div class="modal-overlay" id="modal">
                    <div class="modal-content">
                        <span class="modal-close">&times;</span>
                        <div class="modal-emoji"></div>
                        <div class="modal-info">
                            <h2 class="modal-city"></h2>
                            <p class="modal-label"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <footer class="footer">
            <p>&copy; 2026 小羊星冰乐. All rights reserved.</p>
        </footer>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
