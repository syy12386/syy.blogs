<body>
    <div class="container">
        <div class="card footprints-card">
            <div class="back-link">
                <a href="index.html" class="btn btn-secondary">← 返回主页</a>
            </div>
            
            <h1 class="page-title">我的<span class="highlight">足迹</span></h1>
            
            <div class="map-container">
                <div style="border:3px solid #000; border-radius:12px; overflow:hidden; box-shadow:5px 5px 0 #000; height:400px; width:100%;">
                  <div id="amap-container" style="width:100%; height:100%;"></div>
                </div>
            </div>
            
            <script src="https://webapi.amap.com/maps?v=1.4.15&key=f1387d7959d15c09ace98d64531e30fb"></script>
            <script>
            var map = new AMap.Map('amap-container', {
              zoom: 4,
              center: [116.397428, 39.90923],
              mapStyle: 'amap://styles/lightblue',
              viewMode: '3D'
            });

            var starMarkers = [
                { lng: 117.2830, lat: 31.8612, city: "合肥" },
                { lng: 116.8344, lat: 32.9370, city: "淮南" },
                { lng: 115.8155, lat: 32.8015, city: "阜阳" },
                { lng: 121.4737, lat: 31.2304, city: "上海" },
                { lng: 120.1936, lat: 30.2741, city: "浙江" },
                { lng: 118.7969, lat: 32.0603, city: "南京" },
                { lng: 108.9480, lat: 34.2619, city: "陕西" }
            ];

            starMarkers.forEach(function(point) {
              var starIcon = new AMap.Icon({
                size: new AMap.Size(32, 32),
                image: 'https://cdn-icons-png.flaticon.com/512/1828/1828884.png',
                imageSize: new AMap.Size(32, 32)
              });

              var marker = new AMap.Marker({
                position: new AMap.LngLat(point.lng, point.lat),
                icon: starIcon,
                offset: new AMap.Pixel(-16, -16)
              });

              marker.setMap(map);
              marker.on('click', function() {
                var infoWindow = new AMap.InfoWindow({
                  content: `<h4 style="color:#333; margin:0;">${point.city}</h4>`,
                  offset: new AMap.Pixel(0, -30)
                });
                infoWindow.open(map, marker.getPosition());
              });
            });
            </script>
